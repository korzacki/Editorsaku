name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Batalkan build lama kalau ada push baru di branch yang sama
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # perlu untuk bikin GitHub Release saat push tag

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug + release APK
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Rapikan nama APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk   dist/EditorSaku-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/EditorSaku-release.apk
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EditorSaku-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Buat GitHub Release (hanya saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
