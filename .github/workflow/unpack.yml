name: Unpack
# Upload sebuah .zip ke root repo, lalu jalankan workflow ini (Actions -> Unpack -> Run workflow).
# Isinya diekstrak ke root repo. Kalau zip dibungkus satu folder (mis. Proyek-main/), folder itu dibuang
# supaya berkas langsung ada di root. Folder .github tidak ditimpa (token bawaan tidak boleh mengubah workflow).
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find zip
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          [ -n "$ZIP" ] || { echo "Tidak ada .zip di root repo. Upload dulu."; exit 1; }
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          unzip -l "$ZIP" | head -40
      - name: Extract (flatten single top folder)
        run: |
          mkdir -p /tmp/unz
          unzip -q -o "$ZIP" -d /tmp/unz -x '*/.git/*' '.git/*' '*/.history/*' '*/.vscode/*'
          rm -f "$ZIP"
          SRC=/tmp/unz
          # satu folder pembungkus saja di dalam zip? masuk ke dalamnya
          if [ "$(ls -A "$SRC" | wc -l)" = 1 ] && [ -d "$SRC/$(ls -A "$SRC")" ]; then SRC="$SRC/$(ls -A "$SRC")"; fi
          rm -rf "$SRC/.github"
          cp -a "$SRC"/. .
          find . -path ./.git -prune -o -type f -print | head -80
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Tidak ada perubahan"; exit 0; }
          git commit -m "Unpack zip"
          git push
